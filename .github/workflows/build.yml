name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: ./package.sh
      - name: Verify architecture and deployment target
        run: |
          for binary in build/Blackout.app/Contents/MacOS/Blackout build/Blackout.app/Contents/Helpers/m1ddc; do
            test "$(lipo -archs "$binary")" = arm64
            test "$(otool -l "$binary" | awk '/LC_BUILD_VERSION/ { found=1 } found && /minos/ { print $2; exit }')" = 13.0
          done
          codesign --verify --deep --strict build/Blackout.app
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackout-macos-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
